edge-dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: "quay.io/zagaos/zagaobserve-edge-dashboard"
    tag: "v2"
    pullPolicy: IfNotPresent
  namespace: observability-edge
  
  service:
    type: ClusterIP
    port: 8080
  route:
    subdomain: edge-dashboard
    enabled: true

 

  dashboard:
    enabled: true
