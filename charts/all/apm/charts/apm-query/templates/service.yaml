{{- if .Values.query.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: {{ .Chart.Name }}
{{- end }}
---
{{- if .Values.query.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.image.redis.name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: {{ .Chart.Name }}
{{- end }}